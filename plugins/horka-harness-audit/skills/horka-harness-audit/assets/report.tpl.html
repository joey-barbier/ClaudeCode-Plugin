<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Page generated by the horka-harness-audit skill · doc-style (neo-brutalist, light theme only). -->
<style>
:root {
  --bg: #FAF4F0; --card: #FFFFFF; --ink: #111111; --muted: #55504C;
  --accent: #AE7AFF; --accent2: #FF8ACD; --ok: #8FE388; --warn: #FFDB58; --ko: #FF6B6B; --info: #87CEEB;
  --mut-bg: #E8E0DA; --code-bg: #F3EAE4; --hair: #DDD3CC;
  --border: 2px solid #111111; --shadow: 4px 4px 0 #111111; --shadow-sm: 3px 3px 0 #111111;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); margin: 0;
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
}
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 2px; overflow-wrap: anywhere; }
pre {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--code-bg);
  border: var(--border); border-radius: 2px; padding: 10px 12px; overflow-x: auto; margin: 8px 0 0;
}
main { max-width: 1020px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
.top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.eyebrow {
  font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  background: var(--accent); border: var(--border); box-shadow: var(--shadow-sm);
  display: inline-block; padding: 3px 9px; border-radius: 2px;
}
h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 900; line-height: 1.12; margin: 0 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
.tl { color: var(--muted); font-size: 14px; margin: 0 0 18px; max-width: 72ch; }
h2 { font-size: 19px; font-weight: 900; margin: 34px 0 10px; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h2 .count { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0; }
.ess { background: var(--card); border: var(--border); box-shadow: var(--shadow); border-radius: 4px; padding: 14px 18px; margin: 0 0 8px; font-size: 14.5px; }
.ess .chip { margin-right: 8px; }
.chip {
  display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; padding: 2px 8px;
  border: 2px solid #111; border-radius: 2px; white-space: nowrap; color: #111; vertical-align: 1px; text-transform: uppercase;
}
.c-ia { background: var(--accent); } .c-code { background: var(--warn); } .c-toi { background: #111; color: #fff; }
.c-ok { background: var(--ok); } .c-ko { background: var(--ko); } .c-info { background: var(--info); } .c-mut { background: var(--mut-bg); }

/* levels: one card per repository, three meters */
.levels { display: grid; gap: 16px; margin: 18px 0 6px; }
.repo { background: var(--card); border: var(--border); box-shadow: var(--shadow); border-radius: 4px; padding: 14px 16px 12px; min-width: 0; }
.repo .name { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 16px; font-weight: 900; margin-bottom: 10px; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.meter { min-width: 0; }
.meter .lab { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.meter .row { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
.meter .val { font-size: 32px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.meter .val small { font-size: 15px; font-weight: 800; color: var(--muted); }
.bar { display: flex; gap: 4px; flex: 1; max-width: 150px; }
.bar i { flex: 1; height: 14px; border: 2px solid #111; border-radius: 2px; background: var(--card); }
.bar.l1 i.on { background: var(--ko); } .bar.l2 i.on { background: var(--warn); } .bar.l3 i.on { background: var(--ok); }
.meter .what { font-size: 12.5px; color: var(--muted); }
.meter .unsure { font-size: 12.5px; margin-top: 5px; }
.repo .next { margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--hair); font-size: 13.5px; }
.repo .next b { font-weight: 800; }

/* plus and minus */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 14px 0 4px; }
.col { background: var(--card); border: var(--border); box-shadow: var(--shadow); border-radius: 4px; padding: 14px 16px; min-width: 0; }
.col h3 { margin: 0 0 10px; font-size: 14px; font-weight: 900; display: flex; gap: 8px; align-items: center; }
.col ul { margin: 0; padding: 0; list-style: none; }
.col li { padding: 8px 0; border-top: 1px solid var(--hair); font-size: 13.5px; }
.col li:first-child { border-top: none; padding-top: 0; }
.col li .ev { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* actions */
.actions { display: grid; gap: 12px; margin: 12px 0 4px; }
.act { display: grid; grid-template-columns: 46px 1fr; background: var(--card); border: var(--border); box-shadow: var(--shadow); border-radius: 4px; min-width: 0; }
.act .n { display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; font-size: 24px; font-weight: 900; background: var(--warn); border-right: var(--border); font-variant-numeric: tabular-nums; }
.act .b { padding: 11px 14px 12px; min-width: 0; }
.act .t { font-size: 15px; font-weight: 900; margin: 0 0 5px; }
.act .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.act .stops { font-size: 13.5px; margin: 0; }
.act .stops b { font-weight: 800; }
.act details { margin-top: 8px; font-size: 13px; }
.act summary { cursor: pointer; font-weight: 800; }

/* tables */
.card { background: var(--card); border: var(--border); box-shadow: var(--shadow); border-radius: 4px; margin: 8px 0 4px; }
.twrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; padding: 10px 12px; border-bottom: var(--border); background: var(--code-bg); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--hair); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.k { white-space: nowrap; font-weight: 700; }
td.cmd code { white-space: nowrap; }
td.sm { font-size: 12.5px; color: var(--muted); }

.limits { color: var(--muted); font-size: 13px; margin: 6px 0 0; padding-left: 18px; }
.limits li { margin-bottom: 3px; }
.foot { color: var(--muted); font-size: 12.5px; border-top: var(--border); padding-top: 14px; margin-top: 40px; }
@media (max-width: 560px) { .act { grid-template-columns: 38px 1fr; } .meter .val { font-size: 28px; } }
</style>
</head>
<body>
<main>
  <div class="top"><span class="eyebrow">{{EYEBROW}}</span><span class="chip c-mut">{{DATE}}</span></div>
  <h1>{{TITLE}}</h1>
  <p class="tl">{{TAGLINE}}</p>
  <div class="ess"><span class="chip c-info">{{L_ESSENTIAL}}</span>{{SUMMARY}}</div>

  <div class="levels">{{LEVELS}}</div>

  <div class="cols">{{PLUS_MINUS}}</div>

  {{ACTIONS}}
  {{PROBES}}
  {{CRITERIA}}
  {{DEBT}}
  {{LIMITS}}

  <p class="foot">{{FOOT}}</p>
</main>
</body>
</html>
